<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Samsung Experience Store · Encuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1428A0;--b2:#3d5bff;--ink:#0f1222;--mut:#636b82;--line:#e4e8f3;--soft:#f5f6fb;--bad:#a8261b;--badbg:#fdecea;
--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--ink);min-height:100vh;min-height:100dvh;
background:linear-gradient(135deg,#eef1ff 0%,#f8f5ff 50%,#e9f5ff 100%)}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
body::before{width:440px;height:440px;background:#3d5bff;left:-140px;top:-120px;opacity:.26}
body::after{width:400px;height:400px;background:#00c6ff;right:-120px;bottom:-100px;opacity:.24}
.hidden{display:none!important}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 12px}

/* tarjeta central */
.card{width:100%;max-width:680px;background:#fff;border:1px solid #e7eaf5;border-radius:32px;
box-shadow:0 40px 90px -30px #1428a04d,0 10px 30px -12px #0b102026}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#000;color:#fff;padding:18px 28px;border-radius:31px 31px 0 0}
.logo{width:138px;height:auto;display:block}
.store{text-align:right;line-height:1.3;min-width:0}
.store b{display:block;font-size:14px;font-weight:700}
.store span{display:block;font-size:12px;opacity:.7;font-weight:500}
.store span:empty{display:none}

/* progreso */
.prog{padding:20px 28px 0}
.meter{height:6px;background:#eceff8;border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:6%;border-radius:6px;background:linear-gradient(90deg,var(--b),var(--b2),#7aa2ff);transition:width .45s cubic-bezier(.4,0,.2,1)}
.count{display:block;margin-top:10px;font-size:13px;font-weight:600;color:var(--mut)}

/* contenido y transiciones */
.body{padding:20px 28px 10px;min-height:360px}
@keyframes inNext{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.body.in-next{animation:inNext .4s cubic-bezier(.22,.9,.3,1)}
.body.in-prev{animation:inPrev .4s cubic-bezier(.22,.9,.3,1)}
h2{font-size:clamp(24px,5.4vw,32px);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:16px;line-height:1.5;margin-top:10px}
.tag{display:inline-block;background:linear-gradient(135deg,#e8edff,#f4f6ff);border:1px solid #dbe2ff;color:var(--b);font-weight:700;font-size:13px;padding:7px 13px;border-radius:99px;margin-bottom:16px}

/* asesores */
.opts{display:grid;gap:12px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:66px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.opt:hover{transform:translateY(-2px);border-color:#aab8ff;background:#fafbff;box-shadow:0 12px 26px -12px #1428a04d}
.opt.sel{border-color:var(--b);background:linear-gradient(135deg,#eef1ff,#f7f8ff);box-shadow:0 0 0 4px #3d5bff22}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 14px -4px #1428a066}
.nm{flex:1;min-width:0}
.opt .ck{width:26px;height:26px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:14px;opacity:0;transform:scale(.5);transition:.2s}
.opt.sel .ck{opacity:1;transform:none}

/* calificación en tarjetas */
.rate{display:grid;grid-template-columns:1fr;gap:10px;margin-top:26px}
.rc{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;font:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.rc .em{font-size:28px;line-height:1}
.rc .lb{flex:1;font-weight:700;font-size:17px;color:var(--ink)}
.rc kbd{font:700 12px/1 var(--f);color:var(--mut);background:var(--soft);border:1.5px solid var(--line);border-radius:8px;padding:6px 9px}
.rc:hover{transform:translateY(-3px);border-color:#aab8ff;background:#fafbff;box-shadow:0 14px 28px -14px #1428a055}
.rc.sel{border-color:var(--b);background:linear-gradient(135deg,#eef1ff,#f7f8ff);box-shadow:0 0 0 4px #3d5bff22,0 14px 28px -14px #1428a066}
.rc.sel kbd{background:var(--b);border-color:var(--b);color:#fff}
.hint{margin-top:18px;color:var(--mut);font-size:13px;text-align:center}
.kbhint{display:none}
@media(hover:hover){.kbhint{display:inline}}
@media(min-width:640px){
.rate{grid-template-columns:repeat(5,1fr)}
.rc{flex-direction:column;justify-content:center;gap:10px;min-height:134px;padding:18px 6px;text-align:center}
.rc .em{font-size:38px}
.rc .lb{flex:none;font-size:15px}
.rc kbd{position:absolute;top:8px;left:8px}
}

/* campos con etiqueta flotante */
.fl{position:relative;margin-top:18px}
.fl input,.fl textarea{width:100%;padding:26px 16px 10px;border:2px solid var(--line);border-radius:16px;font:500 17px/1.3 var(--f);color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s}
.fl textarea{min-height:124px;resize:vertical}
.fl label{position:absolute;left:18px;top:19px;color:var(--mut);font-size:16px;font-weight:500;pointer-events:none;transition:all .18s}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label,.fl textarea:focus+label,.fl textarea:not(:placeholder-shown)+label{top:8px;font-size:12px;font-weight:700;color:var(--b)}
.fl input:focus,.fl textarea:focus{outline:0;border-color:var(--b2);box-shadow:0 0 0 4px #3d5bff22}
.fl .ln{position:absolute;left:18px;right:18px;bottom:3px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--b),var(--b2));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.fl:focus-within .ln{transform:scaleX(1)}
.fl.lk input{background:var(--soft);color:var(--mut);border-style:dashed}
.fl.lk::after{content:"🔒";position:absolute;right:16px;top:20px;font-size:15px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.note{color:var(--mut);font-size:13px;line-height:1.5;margin-top:16px}
.err{display:none;margin-top:16px;background:var(--badbg);color:var(--bad);padding:13px 15px;border-radius:14px;font-size:15px;line-height:1.4}
.err.show{display:block}

/* navegación */
.nav{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:16px 28px 24px;background:linear-gradient(180deg,#fff0,#fff 30%);border-radius:0 0 31px 31px}
.nb{border:0;border-radius:16px;font:700 16px var(--f);padding:15px 22px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
#prev{background:#f1f3fa;color:var(--ink)}
#prev::before{content:"←  "}
#prev:hover{background:#e6e9f6;transform:translateX(-2px)}
#next{margin-left:auto;min-width:150px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;box-shadow:0 14px 28px -12px #1428a0b3}
#next:not(.send)::after{content:"  →"}
#next.send{flex:1;max-width:280px}
#next:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 32px -12px #1428a0cc}
#next:active:not(:disabled),#prev:active{transform:scale(.97)}
#next:disabled{background:#d9deef;color:#8a92a8;box-shadow:none;cursor:not-allowed}
.btn{display:inline-block;margin-top:22px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;font:700 16px var(--f);padding:15px 24px;text-decoration:none;cursor:pointer;box-shadow:0 14px 28px -12px #1428a0b3}

/* pantalla final */
.thanks{position:relative;overflow:hidden;text-align:center;padding:40px 4px 20px}
.ok{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff;background:linear-gradient(135deg,#12a36b,#2ad48f);box-shadow:0 0 0 10px #12a36b22,0 0 0 22px #12a36b11;animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.cf{position:absolute;top:0;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.4s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(320px) rotate(540deg)}}

.foot{text-align:center;color:var(--mut);font-size:13px;padding:22px 12px calc(14px + env(safe-area-inset-bottom))}
.foot a{color:var(--mut)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}

@media(max-width:560px){
.stage{padding:12px 10px 4px;justify-content:flex-start}
.card{border-radius:28px}
.brand{padding:14px 18px;border-radius:27px 27px 0 0}
.logo{width:116px}
.prog{padding:16px 18px 0}
.body{padding:18px 18px 8px;min-height:0}
.nav{padding:14px 18px 18px;border-radius:0 0 27px 27px}
.nb{padding:15px 18px}
#next{min-width:0;flex:1;max-width:none;margin-left:12px}
#next.send{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<button type="button" class="nb" id="prev" aria-label="Volver a la pregunta anterior">Anterior</button>
<button type="button" class="nb" id="next">Siguiente</button>
</div>
</main>
<footer class="foot">Tu opinión nos ayuda a mejorar · <a href="admin.html">Acceso administración</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://lxmjfsdmbwgqxtovtxyn.supabase.co";
const SUPABASE_KEY="sb_publishable_5Ohm6MN0IU3dr4qcP96x5g_9WKc095V";

/* Pega aquí el enlace de reseñas de Google de la tienda (opcional).
   Si lo dejas vacío, el botón no aparece. */
const GOOGLE_REVIEW_URL="";

const QUESTIONS=[
{key:"service_rating",tag:"Atención",title:"¿Qué tan rápida fue la atención que recibiste al llegar a la tienda?"},
{key:"attention_rating",tag:"Conocimiento del producto",title:"¿Qué tan satisfecho estás con el conocimiento que mostró el asesor sobre los productos que te interesaban?"},
{key:"information_rating",tag:"Productos adicionales",title:"¿El asesor identificó y te explicó productos o accesorios adicionales que pudieran complementar tu compra?"},
{key:"solution_rating",tag:"Caja",title:"¿Cómo calificarías la atención que recibiste de nuestro equipo de caja?"},
{key:"recommendation_rating",tag:"Experiencia general",title:"¿Cómo calificarías tu experiencia general en Samsung Store?"}
];
const WORDS=["","Muy mala","Mala","Regular","Buena","Excelente"];
const EMO=["","😞","🙁","😐","🙂","🤩"];
const TOTAL=QUESTIONS.length+2;
const LAST=TOTAL-1;

const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=s=>document.querySelector(s);

const state={
storeId:null,advisors:[],advisor:"",ready:false,loadError:"",
step:0,r:{},f:{name:"",phone:"",comment:""},lock:{name:false,phone:false},t:null,sending:false,dir:"next",done:false
};

function el(tag,props={},...kids){
const e=document.createElement(tag);
for(const k in props){
if(k==="class")e.className=props[k];
else if(k.startsWith("on"))e.addEventListener(k.slice(2),props[k]);
else e.setAttribute(k,props[k]);
}
kids.flat().filter(c=>c!==null&&c!==undefined).forEach(c=>e.append(c));
return e;
}

function initials(name){
return name.trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase();
}

/* ---------- navegación ---------- */

function go(n){
clearTimeout(state.t);
const t=Math.max(0,Math.min(LAST,n));
state.dir=t>=state.step?"next":"prev";
state.step=t;
render();
}

function canNext(){
const s=state.step;
if(s===0)return state.ready&&!!state.advisor;
if(s<=QUESTIONS.length)return !!state.r[QUESTIONS[s-1].key];
return !state.sending;
}
function updateNav(){
const s=state.step,last=s===LAST,n=$("#next");
$("#prev").style.visibility=s>0?"visible":"hidden";
n.textContent=last?"Enviar mi opinión":"Siguiente";
n.classList.toggle("send",last);
n.disabled=!canNext();
}
function choose(key,n){
state.r[key]=n;
document.querySelectorAll(".rc").forEach(b=>{
const on=Number(b.dataset.n)===n;
b.classList.toggle("sel",on);b.setAttribute("aria-checked",String(on));
});
updateNav();
clearTimeout(state.t);
/* avanza solo tras una breve pausa; "Siguiente" y "Anterior" siguen disponibles */
state.t=setTimeout(()=>{if(QUESTIONS[state.step-1]&&QUESTIONS[state.step-1].key===key&&state.r[key]===n)go(state.step+1)},650);
}

$("#prev").addEventListener("click",()=>go(state.step-1));
$("#next").addEventListener("click",()=>{
if(state.step===LAST)submit();
else if(canNext())go(state.step+1);
});

/* Atajos de teclado: 1 a 5 para responder, Enter para continuar */
document.addEventListener("keydown",e=>{
if(state.done)return;
const tg=e.target.tagName,id=e.target.id;
if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
const s=state.step;
if(s>=1&&s<=QUESTIONS.length&&/^[1-5]$/.test(e.key)){choose(QUESTIONS[s-1].key,Number(e.key));return;}
if(e.key==="Enter"&&id!=="prev"&&id!=="next"&&s<LAST&&canNext()){e.preventDefault();go(s+1);}
});

function render(){
const s=state.step,q=s>=1&&s<=QUESTIONS.length;

$("#meter").style.width=Math.max(6,s/LAST*100)+"%";
$("#count").textContent=s===0?"Comencemos":q?`Pregunta ${s} de ${QUESTIONS.length}`:"Casi listo";

const box=$("#content");
box.replaceChildren();
box.className="body";
void box.offsetWidth;
box.classList.add(state.dir==="prev"?"in-prev":"in-next");

if(s===0)box.append(viewAdvisor());
else if(q)box.append(viewQuestion(s-1));
else box.append(viewForm());

updateNav();
}

/* ---------- vistas ---------- */

function viewAdvisor(){
const w=el("div");
w.append(
el("span",{class:"tag"},"Encuesta de experiencia · 1 minuto"),
el("h2",{},"¿Quién te atendió?"),
el("p",{class:"sub"},"Elige a tu asesor para empezar.")
);

if(state.loadError){
w.append(
el("div",{class:"err show",role:"alert"},state.loadError),
el("button",{class:"btn",type:"button",onclick:init},"Reintentar")
);
return w;
}

if(!state.ready){
w.append(el("p",{class:"sub"},"Cargando asesores…"));
return w;
}

const list=el("div",{class:"opts",role:"radiogroup","aria-label":"Asesor"});
state.advisors.forEach(name=>{
const on=name===state.advisor;
list.append(
el("button",{
class:"opt"+(on?" sel":""),type:"button",role:"radio","aria-checked":String(on),"data-name":name,
onclick:()=>{
state.advisor=name;
list.querySelectorAll(".opt").forEach(b=>{
const s=b.dataset.name===name;
b.classList.toggle("sel",s);b.setAttribute("aria-checked",String(s));
});
updateNav();
clearTimeout(state.t);
state.t=setTimeout(()=>{if(state.step===0&&state.advisor===name)go(1)},450);
}
},
el("span",{class:"av"},initials(name)),
el("span",{class:"nm"},name),
el("span",{class:"ck"},"✓")
)
);
});
w.append(list);
return w;
}

function viewQuestion(i){
const q=QUESTIONS[i];
const cur=state.r[q.key]||0;

const grid=el("div",{class:"rate",role:"radiogroup","aria-label":q.tag});
for(let n=1;n<=5;n++){
grid.append(
el("button",{
type:"button",class:"rc"+(n===cur?" sel":""),role:"radio","aria-checked":String(n===cur),"data-n":String(n),
onclick:()=>choose(q.key,n)
},
el("span",{class:"em"},EMO[n]),
el("span",{class:"lb"},WORDS[n]),
el("kbd",{},String(n))
)
);
}

return el("div",{},
el("span",{class:"tag"},q.tag),
el("h2",{},q.title),
grid,
el("p",{class:"hint"},"Toca la opción que mejor te describa",el("span",{class:"kbhint"}," · o usa las teclas 1 a 5"))
);
}

function fl(label,id,key,attrs,multi){
const input=el(multi?"textarea":"input",{id,placeholder:" ",...attrs});
input.value=state.f[key];
input.addEventListener("input",()=>{state.f[key]=input.value;});
return el("div",{class:"fl"+(attrs.readonly?" lk":"")},input,el("label",{for:id},label),el("i",{class:"ln"}));
}

function viewForm(){
const err=el("div",{class:"err",id:"err",role:"alert"});

return el("div",{},
el("h2",{},"Último paso"),
el("p",{class:"sub"},state.lock.phone
?"Tus datos ya quedaron registrados. Solo falta enviar tu opinión."
:"Déjanos tus datos para dar seguimiento a tu experiencia."),
fl("Tu nombre","clientName","name",{type:"text",maxlength:"150",autocomplete:"name",...(state.lock.name?{readonly:"readonly"}:{})}),
fl("Número de celular","clientPhone","phone",{type:"tel",inputmode:"tel",maxlength:"20",autocomplete:"tel",...(state.lock.phone?{readonly:"readonly"}:{})}),
fl("Cuéntanos más (opcional)","comment","comment",{maxlength:"1000"},true),
el("input",{class:"hp",id:"website",name:"website",tabindex:"-1",autocomplete:"off","aria-hidden":"true"}),
el("p",{class:"note"},"Usaremos tus datos para dar seguimiento a tu experiencia en la tienda."),
err
);
}

/* ---------- envío ---------- */

function fail(text){
const box=$("#err");
box.textContent=text;
box.classList.add("show");
box.scrollIntoView({block:"nearest",behavior:"smooth"});
}

async function submit(){
if(state.sending)return;
$("#err").classList.remove("show");

const name=state.f.name.trim();
const digits=state.f.phone.replace(/\D/g,"");
const comment=state.f.comment.trim();

if(!state.advisor)return fail("Vuelve al inicio y elige quién te atendió.");
if(QUESTIONS.some(q=>!state.r[q.key]))return fail("Faltan preguntas por responder. Usa el botón Anterior para volver.");
if(!name)return fail("Escribe tu nombre.");
if(digits.length<10||digits.length>15)return fail("Escribe un número de celular válido de 10 dígitos.");
if(!state.storeId)return fail("No se pudo identificar la tienda. Recarga la página.");

const values=QUESTIONS.map(q=>state.r[q.key]);
const average=values.reduce((a,b)=>a+b,0)/values.length;

/* Campo trampa: los bots lo llenan, las personas no lo ven */
if($("#website").value){return done(average);}

state.sending=true;
const btn=$("#next");
btn.disabled=true;
btn.textContent="Enviando…";

try{
const result=await db.from("reviews").insert({
store_id:state.storeId,

/* El asesor sigue guardándose en customer_name para que el panel actual funcione igual */
customer_name:state.advisor,

client_name:name,
client_phone:digits,

rating:Math.round(average),
service_rating:state.r.service_rating,
attention_rating:state.r.attention_rating,
information_rating:state.r.information_rating,
solution_rating:state.r.solution_rating,
recommendation_rating:state.r.recommendation_rating,

comment:comment||null,
is_published:true
});

if(result.error)throw result.error;
done(average);

}catch(e){
console.error("ENCUESTA:",e);
state.sending=false;
if(e&&e.code==="23505")return done(0,true);
btn.disabled=false;
btn.textContent="Enviar mi opinión";
fail("No se pudo enviar tu opinión. Revisa tu conexión e inténtalo de nuevo.");
}
}

function done(average,dup){
state.done=true;
document.querySelector(".nav").classList.add("hidden");
document.querySelector(".prog").classList.add("hidden");

const good=!dup&&average>=4;

$("#content").replaceChildren(
el("div",{class:"thanks"},
el("div",{class:"ok"},"✓"),
el("h2",{},dup?"Ya recibimos tu encuesta":"¡Gracias por compartir tu experiencia!"),
el("p",{class:"sub"},dup
?"Ya hemos recibido tu encuesta anteriormente. Solo registramos una por cliente cada mes en cada tienda. ¡Gracias por tu tiempo!"
:good
?"Nos alegra que tu visita haya sido buena."
:"Lamentamos que tu experiencia no fuera la mejor. Revisaremos tus comentarios para mejorar."),
good&&GOOGLE_REVIEW_URL
?el("a",{class:"btn",href:GOOGLE_REVIEW_URL,target:"_blank",rel:"noopener"},"Dejar reseña en Google")
:null
)
);
if(good){
const t=$("#content .thanks");
for(let i=0;i<22;i++){
const c=document.createElement("i");c.className="cf";
c.style.cssText=`left:${Math.random()*100}%;background:${["#ffb400","#1428A0","#12a36b","#ff5a7a","#4a6bff"][i%5]};animation-delay:${(Math.random()*0.6).toFixed(2)}s`;
t.append(c);
}
}
window.scrollTo(0,0);
}

/* ---------- carga de tienda y asesores ---------- */

async function init(){
state.ready=false;
state.loadError="";
render();

try{
if(!db)throw new Error("No se pudo cargar la conexión.");

const params=new URLSearchParams(location.search);
const slug=params.get("store")||"samsung-store-ambar";
const wanted=(params.get("advisor")||"").trim().toLowerCase();

/* Si el enlace viene de WhatsApp, nombre y celular llegan ya escritos (el cliente puede corregirlos) */
state.f.name=(params.get("name")||"").trim().slice(0,150);
state.f.phone=(params.get("phone")||"").replace(/[^\d+\s()-]/g,"").slice(0,20);

/* Si llegó por WhatsApp con celular válido, esos datos quedan bloqueados (solo lectura).
   Por el QR de la tienda no hay datos en el enlace, así que el cliente los escribe. */
state.lock.phone=state.f.phone.replace(/\D/g,"").length>=10;
state.lock.name=state.lock.phone&&!!state.f.name;

const st=await db.from("stores").select("*").eq("slug",slug).eq("active",true).single();
if(st.error)throw st.error;
if(!st.data)throw new Error("No se encontró la tienda.");

state.storeId=st.data.id;
$("#storeName").textContent=st.data.name;
$("#storeLocation").textContent=
[st.data.city,st.data.state].filter(Boolean).join(", ");

const ad=await db.from("store_advisors").select("id,name")
.eq("store_id",state.storeId).eq("active",true).order("name");
if(ad.error)throw ad.error;

state.advisors=(ad.data||[]).map(a=>a.name);
if(!state.advisors.length)throw new Error("Esta tienda no tiene asesores registrados.");

state.ready=true;

/* Enlace de WhatsApp: si ese celular ya respondió esta tienda este mes, se avisa de inmediato */
if(state.lock.phone){
try{
const dup=await db.rpc("encuesta_ya_respondida",{p_slug:slug,p_phone:state.f.phone.replace(/\D/g,"")});
if(!dup.error&&dup.data===true){done(0,true);return;}
}catch(_){}
}

/* Enlace/QR por asesor: ?advisor=Nombre salta directo a la primera pregunta */
const match=state.advisors.find(n=>n.toLowerCase()===wanted);
if(match){state.advisor=match;go(1);return;}

}catch(e){
console.error("CARGA:",e);
state.loadError="No pudimos cargar la encuesta. Revisa tu conexión e inténtalo de nuevo.";
$("#storeName").textContent="Samsung Experience Store";
$("#storeLocation").textContent="";
}

render();
}

init();
</script>
</body>
</html>
