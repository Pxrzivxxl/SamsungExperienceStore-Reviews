<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Reseñas</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f5f7fa;
    color: #111827;
}

header {
    background: #000;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 20px;
}

.logout {
    background: white;
    color: #000;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.login-card {
    max-width: 450px;
    margin: 60px auto;
}

h2 {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin: 14px 0 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    cursor: pointer;
}

.login-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #000;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.login-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.admin-info {
    background: #111827;
    color: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.review {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 18px;
    margin-top: 15px;
}

.review-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.review-name {
    font-size: 18px;
    font-weight: bold;
}

.review-stars {
    color: #f59e0b;
    font-size: 20px;
    margin: 8px 0;
}

.review-date {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 12px;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.visible {
    background: #dcfce7;
    color: #166534;
}

.hidden-status {
    background: #fee2e2;
    color: #991b1b;
}

.admin-response {
    background: #f3f4f6;
    border-left: 4px solid #111827;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
}

.admin-response strong {
    display: block;
    margin-bottom: 5px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.action {
    border: none;
    padding: 9px 12px;
    border-radius: 9px;
    font-weight: bold;
}

.hide {
    background: #fef3c7;
    color: #92400e;
}

.show {
    background: #dcfce7;
    color: #166534;
}

.delete {
    background: #fee2e2;
    color: #991b1b;
}

.respond {
    background: #e0e7ff;
    color: #3730a3;
}

.refresh {
    background: #000;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.response-box {
    display: none;
    margin-top: 15px;
}

.response-box textarea {
    margin-bottom: 8px;
}

.save-response {
    background: #000;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
}

.cancel-response {
    background: #e5e7eb;
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    margin-left: 5px;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
}

.hidden {
    display: none !important;
}

@media(max-width:600px) {

    header h1 {
        font-size: 17px;
    }

    .container {
        padding: 0 12px;
    }

    .actions {
        flex-direction: column;
    }

    .action {
        width: 100%;
    }
}
</style>
</head>

<body>

<header id="adminHeader" class="hidden">

    <h1>
        Panel de administración
    </h1>

    <button
        class="logout"
        id="logoutButton"
        type="button"
    >
        Cerrar sesión
    </button>

</header>


<!-- LOGIN -->

<section
    id="loginSection"
    class="container"
>

    <div class="card login-card">

        <h2>
            Acceso de administrador
        </h2>

        <p>
            Inicia sesión para administrar las reseñas.
        </p>


        <label for="email">
            Correo
        </label>

        <input
            type="email"
            id="email"
            placeholder="Escribe tu correo"
            autocomplete="email"
        >


        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            placeholder="Escribe tu contraseña"
            autocomplete="current-password"
        >


        <button
            class="login-button"
            id="loginButton"
            type="button"
        >
            Entrar
        </button>


        <div
            class="message error"
            id="loginError"
        ></div>

    </div>

</section>


<!-- PANEL -->

<main
    id="adminSection"
    class="container hidden"
>

    <div class="admin-info">

        <strong>
            Administrador
        </strong>

        <div id="adminEmail"></div>

    </div>


    <div class="card">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <div>

                <h2>
                    Reseñas de clientes
                </h2>

                <p style="color:#6b7280">
                    Puedes mostrar, ocultar, responder o eliminar reseñas.
                </p>

            </div>


            <button
                class="refresh"
                id="refreshButton"
                type="button"
            >
                Actualizar
            </button>

        </div>


        <div id="reviewsList">

            <div class="empty">
                Cargando reseñas...
            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/*
====================================================
SUPABASE
====================================================
*/

const SUPABASE_URL =
    "https://lxmjfsdmbwgqxtovtxyn.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_5Ohm6MN0IU3dr4qcP96x5g_9WKc095V";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/*
====================================================
ADMIN PERMITIDO
====================================================
*/

const ADMIN_EMAIL =
    "ethelredbcp@gmail.com";


/*
====================================================
ELEMENTOS
====================================================
*/

const loginSection =
    document.getElementById(
        "loginSection"
    );

const adminSection =
    document.getElementById(
        "adminSection"
    );

const adminHeader =
    document.getElementById(
        "adminHeader"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const reviewsList =
    document.getElementById(
        "reviewsList"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );


/*
====================================================
ERROR LOGIN
====================================================
*/

function showLoginError(
    message
) {

    loginError.textContent =
        message;

    loginError.style.display =
        "block";
}


/*
====================================================
OCULTAR ERROR
====================================================
*/

function hideLoginError() {

    loginError.textContent =
        "";

    loginError.style.display =
        "none";
}


/*
====================================================
LOGIN
====================================================
*/

async function loginAdmin() {

    hideLoginError();


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email) {

        showLoginError(
            "Escribe tu correo."
        );

        return;
    }


    if (!password) {

        showLoginError(
            "Escribe tu contraseña."
        );

        return;
    }


    if (
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showLoginError(
            "Este correo no tiene acceso de administrador."
        );

        return;
    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "Entrando...";


    try {

        const result =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if (result.error) {

            console.error(
                "ERROR LOGIN:",
                result.error
            );

            showLoginError(
                result.error.message ||
                "No se pudo iniciar sesión."
            );

            return;
        }


        if (
            !result.data ||
            !result.data.user
        ) {

            showLoginError(
                "No se encontró el usuario."
            );

            return;
        }


        if (
            !result.data.user.email ||
            result.data.user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            await supabaseClient.auth
                .signOut();

            showLoginError(
                "Este usuario no es administrador."
            );

            return;
        }


        showAdminPanel(
            result.data.user
        );


    }
    catch (error) {

        console.error(
            "ERROR LOGIN:",
            error
        );

        showLoginError(
            error.message ||
            "Ocurrió un error al iniciar sesión."
        );

    }
    finally {

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Entrar";
    }
}


/*
====================================================
BOTÓN ENTRAR
====================================================
*/

loginButton.addEventListener(
    "click",
    loginAdmin
);


/*
====================================================
ENTER EN CONTRASEÑA
====================================================
*/

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loginAdmin();

        }

    }
);


/*
====================================================
ENTER EN CORREO
====================================================
*/

emailInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loginAdmin();

        }

    }
);


/*
====================================================
MOSTRAR PANEL
====================================================
*/

function showAdminPanel(
    user
) {

    loginSection.classList.add(
        "hidden"
    );

    adminSection.classList.remove(
        "hidden"
    );

    adminHeader.classList.remove(
        "hidden"
    );


    document.getElementById(
        "adminEmail"
    ).textContent =
        user.email;


    loadReviews();
}


/*
====================================================
CARGAR RESEÑAS
====================================================
*/

async function loadReviews() {

    reviewsList.innerHTML =
        `
        <div class="empty">
            Cargando reseñas...
        </div>
        `;


    try {

        const result =
            await supabaseClient
                .from("reviews")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            console.error(
                "ERROR REVIEWS:",
                result.error
            );

            reviewsList.innerHTML =
                `
                <div
                    class="message error"
                    style="display:block"
                >

                    No se pudieron cargar las reseñas.

                    <br><br>

                    ${escapeHTML(
                        result.error.message
                    )}

                </div>
                `;

            return;
        }


        const data =
            result.data || [];


        if (
            data.length === 0
        ) {

            reviewsList.innerHTML =
                `
                <div class="empty">
                    No hay reseñas todavía.
                </div>
                `;

            return;
        }


        reviewsList.innerHTML =
            "";


        data.forEach(
            function(review) {

                renderReview(
                    review
                );

            }
        );


    }
    catch (error) {

        console.error(
            "ERROR:",
            error
        );

        reviewsList.innerHTML =
            `
            <div
                class="message error"
                style="display:block"
            >

                Error:

                ${escapeHTML(
                    error.message
                )}

            </div>
            `;

    }

}


/*
====================================================
MOSTRAR UNA RESEÑA
====================================================
*/

function renderReview(
    review
) {

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "review";


    const rating =
        Math.max(
            0,
            Math.min(
                5,
                Number(
                    review.rating || 0
                )
            )
        );


    const starsHTML =
        "★".repeat(
            rating
        ) +
        `
        <span style="color:#d1d5db">
            ${"★".repeat(
                5 - rating
            )}
        </span>
        `;


    const isPublished =
        review.is_published === true;


    item.innerHTML =
        `

        <div class="review-header">

            <div>

                <div class="review-name">

                    ${escapeHTML(
                        review.customer_name ||
                        review.name ||
                        "Cliente"
                    )}

                </div>


                <div class="review-stars">

                    ${starsHTML}

                </div>

            </div>


            <div>

                <span
                    class="status ${
                        isPublished
                            ? "visible"
                            : "hidden-status"
                    }"
                >

                    ${
                        isPublished
                            ? "Visible"
                            : "Oculta"
                    }

                </span>

            </div>

        </div>


        <div>

            ${escapeHTML(
                review.comment ||
                "Sin comentario"
            )}

        </div>


        ${
            review.admin_response
                ?

                `
                <div class="admin-response">

                    <strong>
                        Respuesta del administrador
                    </strong>

                    <div>

                        ${escapeHTML(
                            review.admin_response
                        )}

                    </div>


                    ${
                        review.responded_at
                            ?

                            `
                            <div class="review-date">

                                Respondida:

                                ${formatDate(
                                    review.responded_at
                                )}

                            </div>
                            `

                            :

                            ""
                    }

                </div>
                `

                :

                ""
        }


        <div class="review-date">

            Publicada:

            ${formatDate(
                review.created_at
            )}

        </div>


        <div class="actions">


            ${
                isPublished

                    ?

                    `
                    <button
                        class="action hide"
                        type="button"
                        onclick="togglePublished(
                            '${review.id}',
                            false
                        )"
                    >
                        Ocultar
                    </button>
                    `

                    :

                    `
                    <button
                        class="action show"
                        type="button"
                        onclick="togglePublished(
                            '${review.id}',
                            true
                        )"
                    >
                        Mostrar
                    </button>
                    `
            }


            <button
                class="action respond"
                type="button"
                onclick="openResponse(
                    '${review.id}'
                )"
            >

                ${
                    review.admin_response
                        ? "Editar respuesta"
                        : "Responder"
                }

            </button>


            <button
                class="action delete"
                type="button"
                onclick="deleteReview(
                    '${review.id}'
                )"
            >

                Eliminar

            </button>

        </div>


        <div
            class="response-box"
            id="response-${review.id}"
        >

            <textarea
                id="responseText-${review.id}"
                placeholder="Escribe tu respuesta al cliente..."
            >${escapeHTML(
                review.admin_response || ""
            )}</textarea>


            <button
                class="save-response"
                type="button"
                onclick="saveResponse(
                    '${review.id}'
                )"
            >

                Guardar respuesta

            </button>


            <button
                class="cancel-response"
                type="button"
                onclick="closeResponse(
                    '${review.id}'
                )"
            >

                Cancelar

            </button>

        </div>

        `;


    reviewsList.appendChild(
        item
    );
}


/*
====================================================
MOSTRAR / OCULTAR
====================================================
*/

async function togglePublished(
    reviewId,
    published
) {

    const result =
        await supabaseClient
            .from("reviews")
            .update({

                is_published:
                    published

            })
                   .eq(
            "id",
            reviewId
        );

    if (result.error) {

        alert(
            "No se pudo actualizar la reseña:\n\n" +
            result.error.message
        );

        console.error(
            result.error
        );

        return;
    }

    await loadReviews();

}


/*
====================================================
ELIMINAR RESEÑA
====================================================
*/

async function deleteReview(reviewId) {

    const confirmar = confirm(
        "¿Seguro que quieres eliminar esta reseña?\n\nEsta acción no se puede deshacer."
    );

    if (!confirmar) return;

    const { error } =
        await supabaseClient
            .from("reviews")
            .delete()
            .eq(
                "id",
                reviewId
            );

    if (error) {

        alert(
            "No se pudo eliminar la reseña:\n\n" +
            error.message
        );

        console.error(error);

        return;
    }

    await loadReviews();

}


/*
====================================================
ABRIR RESPUESTA
====================================================
*/

function openResponse(reviewId) {

    const box =
        document.getElementById(
            `response-${reviewId}`
        );

    if (!box) return;

    box.style.display = "block";
}


/*
====================================================
CERRAR RESPUESTA
====================================================
*/

function closeResponse(reviewId) {

    const box =
        document.getElementById(
            `response-${reviewId}`
        );

    if (!box) return;

    box.style.display = "none";
}


/*
====================================================
GUARDAR RESPUESTA
====================================================
*/

async function saveResponse(reviewId) {

    const textarea =
        document.getElementById(
            `responseText-${reviewId}`
        );

    if (!textarea) return;

    const response =
        textarea.value.trim();

    if (!response) {

        alert(
            "Escribe una respuesta antes de guardar."
        );

        return;
    }

    const { error } =
        await supabaseClient
            .from("reviews")
            .update({

                admin_response:
                    response,

                responded_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                reviewId
            );

    if (error) {

        alert(
            "No se pudo guardar la respuesta:\n\n" +
            error.message
        );

        console.error(error);

        return;
    }

    await loadReviews();
}


/*
====================================================
ACTUALIZAR
====================================================
*/

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        async () => {

            await loadReviews();

        }
    );


/*
====================================================
CERRAR SESIÓN
====================================================
*/

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async () => {

            await supabaseClient.auth.signOut();

            adminSection.classList.add(
                "hidden"
            );

            adminHeader.classList.add(
                "hidden"
            );

            loginSection.classList.remove(
                "hidden"
            );

            document
                .getElementById("password")
                .value = "";

        }
    );


/*
====================================================
COMPROBAR SESIÓN EXISTENTE
====================================================
*/

async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (
        data &&
        data.session &&
        data.session.user
    ) {

        const user =
            data.session.user;

        if (
            user.email &&
            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ) {

            showAdminPanel(user);

            return;
        }

        await supabaseClient.auth.signOut();
    }
}


/*
====================================================
SEGURIDAD PARA MOSTRAR TEXTO
====================================================
*/

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;
}


/*
====================================================
FORMATO DE FECHA
====================================================
*/

function formatDate(date) {

    if (!date) return "";

    const parsed =
        new Date(date);

    if (
        Number.isNaN(
            parsed.getTime()
        )
    ) {
        return "";
    }

    return parsed.toLocaleDateString(
        "es-MX",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


/*
====================================================
INICIAR
====================================================
*/

checkSession();

</script>

</body>
</html>
