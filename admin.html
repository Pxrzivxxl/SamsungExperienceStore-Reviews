<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Reseñas</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f5f7fa;
    color: #111827;
}

header {
    background: #000;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 20px;
}

.logout {
    background: white;
    color: #000;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.login-card {
    max-width: 450px;
    margin: 60px auto;
}

h2 {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin: 14px 0 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #000;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    cursor: pointer;
}

.login-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #000;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.login-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    line-height: 1.4;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.review {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 18px;
    margin-top: 15px;
}

.review-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.review-name {
    font-size: 18px;
    font-weight: bold;
}

.review-stars {
    color: #f59e0b;
    font-size: 20px;
    margin: 8px 0;
}

.review-comment {
    line-height: 1.5;
    white-space: pre-wrap;
}

.review-date {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 12px;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-visible {
    background: #dcfce7;
    color: #166534;
}

.status-hidden {
    background: #fee2e2;
    color: #991b1b;
}

.admin-response {
    background: #f3f4f6;
    border-left: 4px solid #111827;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    line-height: 1.5;
}

.admin-response strong {
    display: block;
    margin-bottom: 5px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.action {
    border: none;
    padding: 9px 12px;
    border-radius: 9px;
    font-weight: bold;
}

.hide {
    background: #fef3c7;
    color: #92400e;
}

.show {
    background: #dcfce7;
    color: #166534;
}

.delete {
    background: #fee2e2;
    color: #991b1b;
}

.respond {
    background: #e0e7ff;
    color: #3730a3;
}

.refresh {
    background: #000;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.response-box {
    display: none;
    margin-top: 15px;
}

.response-box textarea {
    margin-bottom: 8px;
}

.save-response {
    background: #000;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
}

.cancel-response {
    background: #e5e7eb;
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    margin-left: 5px;
    padding: 10px 15px;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
}

.hidden {
    display: none !important;
}

.loading {
    text-align: center;
    color: #6b7280;
    padding: 25px;
}

@media(max-width:600px) {

    header h1 {
        font-size: 17px;
    }

    .container {
        padding: 0 12px;
    }

    .login-card {
        margin-top: 30px;
    }

    .actions {
        flex-direction: column;
    }

    .action {
        width: 100%;
    }

}

</style>
</head>

<body>


<!-- =========================================
     CABECERA
========================================= -->

<header
    id="adminHeader"
    class="hidden"
>

    <h1>
        Panel de administración
    </h1>

    <button
        class="logout"
        id="logoutButton"
        type="button"
    >
        Cerrar sesión
    </button>

</header>


<!-- =========================================
     LOGIN
========================================= -->

<section
    id="loginSection"
    class="container"
>

    <div class="card login-card">

        <h2>
            Acceso de administrador
        </h2>

        <p>
            Inicia sesión para administrar las reseñas.
        </p>


        <label for="email">
            Correo
        </label>

        <input
            type="email"
            id="email"
            placeholder="Escribe tu correo"
            autocomplete="email"
        >


        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            placeholder="Escribe tu contraseña"
            autocomplete="current-password"
        >


        <button
            class="login-button"
            id="loginButton"
            type="button"
        >
            Entrar
        </button>


        <div
            class="message error"
            id="loginError"
        ></div>

    </div>

</section>


<!-- =========================================
     PANEL ADMINISTRADOR
========================================= -->

<main
    id="adminSection"
    class="container hidden"
>


    <div class="card">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <div>

                <h2>
                    Reseñas de clientes
                </h2>

                <p style="color:#6b7280">

                    Puedes mostrar, ocultar,
                    responder o eliminar reseñas.

                </p>

            </div>


            <button
                class="refresh"
                id="refreshButton"
                type="button"
            >
                Actualizar
            </button>

        </div>


        <div
            id="reviewsList"
        >

            <div class="loading">
                Cargando reseñas...
            </div>

        </div>

    </div>

</main>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================================
   CONFIGURACIÓN SUPABASE
========================================= */

const SUPABASE_URL =
    "https://lxmjfsdmbwgqxtovtxyn.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_5Ohm6MN0IU3dr4qcP96x5g_9WKc095V";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   CORREO AUTORIZADO
========================================= */

const ADMIN_EMAIL =
    "ethelredbcp@gmail.com";


/* =========================================
   ELEMENTOS
========================================= */

const loginSection =
    document.getElementById(
        "loginSection"
    );


const adminSection =
    document.getElementById(
        "adminSection"
    );


const adminHeader =
    document.getElementById(
        "adminHeader"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const reviewsList =
    document.getElementById(
        "reviewsList"
    );


/* =========================================
   ERROR DE LOGIN
========================================= */

function showLoginError(
    message
) {

    loginError.textContent =
        message;

    loginError.style.display =
        "block";

}


/* =========================================
   OCULTAR ERROR
========================================= */

function hideLoginError() {

    loginError.textContent =
        "";

    loginError.style.display =
        "none";

}


/* =========================================
   INICIAR SESIÓN
========================================= */

async function login() {

    const email =
        emailInput
            .value
            .trim();


    const password =
        passwordInput
            .value;


    hideLoginError();


    if (!email) {

        showLoginError(
            "Escribe tu correo."
        );

        return;

    }


    if (!password) {

        showLoginError(
            "Escribe tu contraseña."
        );

        return;

    }


    if (
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showLoginError(
            "Este correo no tiene acceso de administrador."
        );

        return;

    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "Entrando...";


    try {

        const result =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        const data =
            result.data;

        const error =
            result.error;


        if (error) {

            console.error(
                "ERROR LOGIN:",
                error
            );

            showLoginError(
                error.message ||
                "No se pudo iniciar sesión."
            );

            return;

        }


        if (
            !data ||
            !data.user
        ) {

            showLoginError(
                "No se encontró el usuario."
            );

            return;

        }


        if (
            !data.user.email ||
            data.user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            await supabaseClient.auth
                .signOut();

            showLoginError(
                "Este usuario no tiene permisos de administrador."
            );

            return;

        }


        showAdminPanel();


    }
    catch (error) {

        console.error(
            "ERROR:",
            error
        );

        showLoginError(
            error.message ||
            "Ocurrió un error al iniciar sesión."
        );

    }
    finally {

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Entrar";

    }

}


/* =========================================
   BOTÓN ENTRAR
========================================= */

loginButton.addEventListener(
    "click",
    login
);


/* =========================================
   ENTER EN CORREO
========================================= */

emailInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            login();

        }

    }
);


/* =========================================
   ENTER EN CONTRASEÑA
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            login();

        }

    }
);


/* =========================================
   MOSTRAR PANEL
========================================= */

function showAdminPanel() {

    loginSection.classList.add(
        "hidden"
    );


    adminSection.classList.remove(
        "hidden"
    );


    adminHeader.classList.remove(
        "hidden"
    );


    loadReviews();

}


/* =========================================
   CARGAR TODAS LAS RESEÑAS
========================================= */

async function loadReviews() {

    reviewsList.innerHTML =
        `
        <div class="loading">
            Cargando reseñas...
        </div>
        `;


    try {

        const result =
            await supabaseClient
                .from("reviews")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        const data =
            result.data;

        const error =
            result.error;


        if (error) {

            console.error(
                "ERROR REVIEWS:",
                error
            );


            reviewsList.innerHTML =
                `
                <div
                    class="message error"
                    style="display:block"
                >

                    No se pudieron cargar las reseñas.

                    <br><br>

                    ${escapeHTML(
                        error.message ||
                        "Error desconocido"
                    )}

                </div>
                `;

            return;

        }


        if (
            !data ||
            data.length === 0
        ) {

            reviewsList.innerHTML =
                `
                <div class="empty">
                    No hay reseñas todavía.
                </div>
                `;

            return;

        }


        reviewsList.innerHTML =
            "";


        data.forEach(
            function(review) {

                renderReview(
                    review
                );

            }
        );


    }
    catch (error) {

        console.error(
            "ERROR:",
            error
        );


        reviewsList.innerHTML =
            `
            <div
                class="message error"
                style="display:block"
            >

                Ocurrió un error al cargar las reseñas.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Error desconocido"
                )}

            </div>
            `;

    }

}


/* =========================================
   CREAR RESEÑA EN EL PANEL
========================================= */

function renderReview(
    review
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "review";


    const rating =
        Math.max(
            0,
            Math.min(
                5,
                Number(
                    review.rating || 0
                )
            )
        );


    const starsHTML =
        "★".repeat(
            rating
        ) +
        `
        <span style="color:#d1d5db">
            ${
                "★".repeat(
                    5 - rating
                )
            }
        </span>
        `;


    const published =
        review.is_published === true;


    const response =
        review.admin_response ||
        "";


    item.innerHTML =
        `

        <div class="review-header">

            <div>

                <div class="review-name">

                    ${
                        escapeHTML(
                            review.customer_name ||
                            "Cliente"
                        )
                    }

                </div>


                <div class="review-stars">

                    ${starsHTML}

                </div>

            </div>


            <div>

                <span
                    class="
                        status
                        ${
                            published
                                ? "status-visible"
                                : "status-hidden"
                        }
                    "
                >

                    ${
                        published
                            ? "Visible"
                            : "Oculta"
                    }

                </span>

            </div>

        </div>


        <div class="review-comment">

            ${
                escapeHTML(
                    review.comment ||
                    "Sin comentario"
                )
            }

        </div>


        ${
            response
                ?

                `

                <div class="admin-response">

                    <strong>
                        Respuesta del administrador
                    </strong>

                    <div>

                        ${
                            escapeHTML(
                                response
                            )
                        }

                    </div>


                    ${
                        review.responded_at
                            ?

                            `
                            <div class="review-date">

                                Respondida:
                                ${
                                    formatDate(
                                        review.responded_at
                                    )
                                }

                            </div>
                            `

                            :

                            ""
                    }

                </div>

                `

                :

                ""
        }


        <div class="review-date">

            Fecha:
            ${
                formatDate(
                    review.created_at
                )
            }

        </div>


        <div class="actions">


            ${
                published

                    ?

                    `
                    <button
                        class="action hide"
                        type="button"
                        data-action="hide"
                        data-id="${review.id}"
                    >
                        Ocultar
                    </button>
                    `

                    :

                    `
                    <button
                        class="action show"
                        type="button"
                        data-action="show"
                        data-id="${review.id}"
                    >
                        Mostrar
                    </button>
                    `
            }


            <button
                class="action respond"
                type="button"
                data-action="respond"
                data-id="${review.id}"
            >

                ${
                    response
                        ? "Editar respuesta"
                        : "Responder"
                }

            </button>


            <button
                class="action delete"
                type="button"
                data-action="delete"
                data-id="${review.id}"
            >

                Eliminar

            </button>


        </div>


        <div
            class="response-box"
            id="response-${review.id}"
        >

            <textarea
                id="responseText-${review.id}"
                placeholder="Escribe tu respuesta al cliente..."
            >${escapeHTML(
                response
            )}</textarea>


            <button
                class="save-response"
                type="button"
                data-action="save-response"
                data-id="${review.id}"
            >
