<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1428A0">
<title>Enviar encuesta por WhatsApp</title>
<style>
:root{--blue:#1428A0;--ink:#101322;--mut:#5d6479;--line:#dfe3ef;--soft:#f3f5fb;--bad:#a8261b;--badbg:#fdecea;--wa:#128c4a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--blue);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.head{color:#fff;padding:calc(22px + env(safe-area-inset-top)) 22px 24px;max-width:560px;width:100%;margin:0 auto}
.head b{display:block;font-size:19px;font-weight:800}
.head span{display:block;font-size:14px;opacity:.8;margin-top:3px;min-height:18px}
.head h1{font-size:clamp(26px,7vw,34px);line-height:1.12;margin-top:18px;font-weight:800;letter-spacing:-.02em}
.sheet{background:#fff;flex:1;width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom))}
.f{margin-bottom:18px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:7px}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical;font-size:15px;line-height:1.45}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:14px;font-size:15px;line-height:1.4;cursor:pointer;font-weight:500;margin-bottom:0}
.ck input{width:24px;height:24px;padding:0;flex:none;margin-top:1px}
.btn{display:block;width:100%;margin-top:20px;border:0;border-radius:16px;background:var(--wa);color:#fff;font:inherit;font-size:18px;font-weight:700;padding:17px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.err{display:none;margin-bottom:16px;background:var(--badbg);color:var(--bad);padding:13px 15px;border-radius:12px;font-size:15px;line-height:1.4}
.err.show{display:block}
.note{color:var(--mut);font-size:13px;line-height:1.45;margin-top:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);background:#0b0f24;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
@media(min-width:700px){body{padding-bottom:24px}.sheet{border-radius:28px;flex:none}}
</style>
</head>
<body>

<div class="head">
<b id="storeName">Samsung Experience Store</b>
<span id="storeLocation"></span>
<h1>Enviar encuesta por WhatsApp</h1>
</div>

<div class="sheet">
<div class="err" id="err" role="alert"></div>

<div class="f">
<label for="advisor">¿Quién atendió al cliente?</label>
<select id="advisor"><option value="">Cargando asesores…</option></select>
</div>

<div class="f">
<label for="cname">Nombre del cliente <small>(opcional)</small></label>
<input id="cname" type="text" autocomplete="off" maxlength="60" placeholder="Para saludarlo por su nombre">
</div>

<div class="f">
<label for="phone">Celular del cliente</label>
<input id="phone" type="tel" inputmode="tel" autocomplete="off" maxlength="20" placeholder="10 dígitos">
</div>

<div class="f">
<label for="msg">Mensaje <small>(puedes editarlo)</small></label>
<textarea id="msg"></textarea>
</div>

<label class="ck"><input type="checkbox" id="ok"> El cliente aceptó recibir la encuesta por WhatsApp.</label>

<button class="btn" id="send" disabled>Abrir WhatsApp</button>
<p class="note">Se abrirá WhatsApp con el mensaje listo. Solo falta que presiones enviar.</p>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://lxmjfsdmbwgqxtovtxyn.supabase.co";
const SUPABASE_KEY="sb_publishable_5Ohm6MN0IU3dr4qcP96x5g_9WKc095V";

/* Dirección de tu página de encuesta. Si la dejas vacía se usa la carpeta donde está
   esta página (funciona si tu encuesta es el index.html de la misma carpeta).
   Si no, escribe la dirección completa, por ejemplo: "https://tuusuario.github.io/encuesta/" */
const SURVEY_URL="";

const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const slug=params.get("store")||"samsung-store-ambar";
let storeName="Samsung Store",edited=false;

function surveyLink(){
const base=SURVEY_URL||new URL("./",location.href).href;
const u=new URL(base);
u.searchParams.set("store",slug);
if($("advisor").value)u.searchParams.set("advisor",$("advisor").value);
return u.toString();
}

function buildMsg(){
const n=$("cname").value.trim(),a=$("advisor").value;
return `Hola${n?" "+n:""}, gracias por tu compra en ${storeName}.`+
(a?` Te atendió ${a}.`:"")+
`\n\n¿Nos ayudas con una breve encuesta sobre tu experiencia? Toma menos de un minuto:\n${surveyLink()}\n\n¡Gracias por tu opinión!`;
}

function refresh(){
if(!edited)$("msg").value=buildMsg();
$("send").disabled=!($("ok").checked&&$("advisor").value);
}

function fail(t){const e=$("err");e.textContent=t;e.classList.add("show");e.scrollIntoView({block:"nearest",behavior:"smooth"})}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}

function normalize(raw){
let d=raw.replace(/\D/g,"");
if(d.length===10)return "52"+d;
if(d.length===13&&d.startsWith("521"))return "52"+d.slice(3);
if(d.length>=11&&d.length<=15)return d;
return "";
}

$("msg").addEventListener("input",()=>{edited=true});
["advisor","cname","ok"].forEach(id=>$(id).addEventListener("input",()=>{
if(id==="advisor"){try{localStorage.setItem("adv_"+slug,$("advisor").value)}catch(_){}}
refresh();
}));

$("send").addEventListener("click",()=>{
$("err").classList.remove("show");
const num=normalize($("phone").value);
if(!$("advisor").value)return fail("Elige quién atendió al cliente.");
if(!num)return fail("Escribe un número de celular válido de 10 dígitos.");
if(!$("ok").checked)return fail("Confirma que el cliente aceptó recibir la encuesta.");
const a=document.createElement("a");
a.href="https://wa.me/"+num+"?text="+encodeURIComponent($("msg").value);
a.target="_blank";a.rel="noopener";
document.body.appendChild(a);a.click();a.remove();
/* Se limpia para el siguiente cliente; el asesor se queda seleccionado */
$("phone").value="";$("cname").value="";$("ok").checked=false;edited=false;refresh();
toast("Listo. Presiona enviar en WhatsApp.");
});

async function init(){
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
try{
if(!db)throw new Error("Sin conexión");
const st=await db.from("stores").select("*").eq("slug",slug).eq("active",true).single();
if(st.error)throw st.error;
storeName=st.data.name;
$("storeName").textContent=st.data.name;
$("storeLocation").textContent=[st.data.city,st.data.state].filter(Boolean).join(", ");
const ad=await db.from("store_advisors").select("name").eq("store_id",st.data.id).eq("active",true).order("name");
if(ad.error)throw ad.error;
const sel=$("advisor");
sel.replaceChildren(new Option("Selecciona al asesor",""));
(ad.data||[]).forEach(a=>sel.append(new Option(a.name,a.name)));
try{const last=localStorage.getItem("adv_"+slug);if(last&&[...sel.options].some(o=>o.value===last))sel.value=last}catch(_){}
}catch(e){
console.error(e);
$("advisor").replaceChildren(new Option("No se pudieron cargar los asesores",""));
fail("No se pudo cargar la tienda. Revisa tu conexión y la dirección de esta página.");
}
refresh();
}
init();
</script>
</body>
</html>
